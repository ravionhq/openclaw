name: Cache restore diagnostics
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  restore:
    name: restore (${{ matrix.probe }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        probe: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ravion/ee=openclaw-bench/type=sandbox/cpu=4/memory=16/disk=32/interruptible=true/id=${{ github.run_id }}-${{ github.run_attempt }}-restore-${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore the observed pnpm archive without saving
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/cache-probe.cjs
        with:
          path: ${{ github.workspace }}/.cache/openclaw-pnpm-store
          key: pnpm-store-v2-Linux-X64-24.x-pnpm@12.9.0+sha512.8f64efa0b792986ca98ae568791bcd7722807e274c4f0c1d9853c62116495c584119db98762a2a5343b1684d361b9ae26fdd16d551666d7635346d3fae830ddd-e7beeeada1ed212418d202ed956f10eef48faac10dfe7a75af090fa740677b45
