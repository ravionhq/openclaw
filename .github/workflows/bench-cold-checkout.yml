name: bench-cold-checkout
run-name: bench-cold-checkout ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        required: false
        default: ""
jobs:
  cold:
    runs-on: ravion/ee=devin-host-bench-20261009-ebe633/type=sandbox/cpu=2/memory=4/disk_cache=auto
    steps:
      - run: "true"
      - uses: actions/checkout@v4
        with:
          repository: ravionhq/handover-test
      - run: du -sh . && ls
