# actionlint configuration
# https://github.com/rhysd/actionlint/blob/main/docs/config.md

self-hosted-runner:
  labels:
    # GitHub's hosted preview labels are not yet in actionlint's built-in inventory.
    - xcode-27
    - xcode-27-xlarge
    # Blacksmith CI runners
    - ravion/ee=openclaw-bench/type=sandbox/cpu=4/memory=16/interruptible=true
    - ravion/ee=openclaw-bench/type=sandbox/cpu=8/memory=32/interruptible=true
    - windows-2025
    - ravion/ee=openclaw-bench/type=sandbox/cpu=16/memory=64/interruptible=true
    - ravion/ee=openclaw-bench/type=sandbox/cpu=32/memory=128/interruptible=true
    - windows-2025
    - windows-2025
    - ravion/ee=openclaw-bench/type=sandbox/cpu=16/memory=64/interruptible=true
    - blacksmith-6vcpu-macos-latest
    - blacksmith-12vcpu-macos-latest
    - macos-15
    - macos-15
    - blacksmith-6vcpu-macos-26
    - blacksmith-12vcpu-macos-26

# Ignore patterns for known issues
paths:
  .github/workflows/**/*.yml:
    ignore:
      # Ignore shellcheck warnings (we run shellcheck separately)
      - "shellcheck reported issue.+"
      # Ignore intentional if: false for disabled jobs
      - 'constant expression "false" in condition'
      # actionlint's built-in runner label allowlist lags Blacksmith additions.
      - 'label "blacksmith-16vcpu-[^"]+" is unknown\.'
  # GitHub Actions supports concurrency.queue, but actionlint does not yet model it.
  .github/workflows/ios-store-release.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/android-store-release.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/qa-live-transports-convex.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/full-release-candidate.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/docker-release.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/docker-channel-promote.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/linux-app-release.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/openclaw-release-publish.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/openclaw-release-promote.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
